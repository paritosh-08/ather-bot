[project]
name = "ather-bot"
version = "0.1.0"
description = "PromptQL-deployable Ather telemetry and Gmail alert monitor"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Paritosh Raj"}]
dependencies = ["requests>=2.32,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8,<1", "mypy>=1.13,<2", "types-requests>=2.32"]

[project.scripts]
ather-bot = "ather_bot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ather_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
packages = ["ather_bot"]
ignore_missing_imports = true
